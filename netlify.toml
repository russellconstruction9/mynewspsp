[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_GEMINI_API_KEY,supabase_key,gemini_api_key"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIza***"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  VITE_SUPABASE_URL = "https://mtdnnjanxqyvklzstwzl.supabase.co"
  # VITE_SUPABASE_ANON_KEY and VITE_GEMINI_API_KEY will be set in Netlify dashboard

[context.deploy-preview.environment]
  VITE_SUPABASE_URL = "https://mtdnnjanxqyvklzstwzl.supabase.co"

[context.branch-deploy.environment]
  VITE_SUPABASE_URL = "https://mtdnnjanxqyvklzstwzl.supabase.co"